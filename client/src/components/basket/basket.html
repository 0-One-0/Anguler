<div class="font-body flex flex-col w-full box-border">
  @for (item of items(); track item.slug) {
    <div class="flex flex-col gap-3 py-4 border-b border-neutral-200 w-full box-border">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <p class="text-xs uppercase tracking-wide text-neutral-500">{{ item.brand }}</p>
          <p class="font-semibold truncate">{{ item.name }}</p>
        </div>
        <p class="font-semibold shrink-0">${{ item.price * item.quantity }}</p>
      </div>

      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <button
            type="button"
            (click)="decrement(item)"
            class="w-6 h-6 flex items-center justify-center rounded-full border border-neutral-300 text-sm"
          >
            &minus;
          </button>
          <span class="text-sm w-4 text-center">{{ item.quantity }}</span>
          <button
            type="button"
            (click)="increment(item)"
            class="w-6 h-6 flex items-center justify-center rounded-full border border-neutral-300 text-sm"
          >
            +
          </button>
        </div>

        <button
          type="button"
          (click)="deleteItem(item.slug)"
          class="text-xs text-neutral-500 underline"
        >
          Remove
        </button>
      </div>
    </div>
  }
</div>
