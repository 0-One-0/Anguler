
<div class="flex gap-2 w-full max-w-300 min-w-0 mx-auto border-box overflow-x-scroll snap-x snap-mandatory pl-0.5 m-0 py-10">
  @for (product of products.value(); track product.slug) {
    <div class="flex flex-col w-[calc((100%-1rem)/3)] shrink-0 snap-start p-2 border border-box bg-amber-50" >
      <img [routerLink]="'/product/' + product.slug" class=" aspect-3/4 object-cover border-box" [src]="product.imageUrl" alt="" />
      <div class="flex ">
        <div>
          <p>{{ product.name }}</p>
          <p>{{ product.brand }}</p>
        </div>

        <p class="ml-auto">{{ product.price }}$</p>
      </div>
    </div>
  }
</div>
