
<div class="block max-w-[1600px] w-[100%] box-border relative overflow-y-scroll max-h-[60dvh]  ">
<table class="table w-[100%] text-start box-border border-separate border-spacing-0" border = "0" cellpadding="8" cellspacing="0">
 <thead>
    <tr class="border-2">
      <th class="border w-80 px-1 text-start  sticky top-0 z-10 bg-white">Product</th>
      <th class="border w-30 text-start px-1 sticky top-0 z-10 bg-white">SKU</th>
      <th class="border w-30 px-1 text-start sticky top-0 z-10 bg-white">Price</th>
      <th class="border w-10 text-start px-1 sticky top-0 z-10 bg-white"></th>


    </tr>
  </thead >
   <tbody class="">
    @if(items.isLoading()){
      <p>loading..</p>
    } @else if(items.error()){
      <p>no products found</p>

    } @else{
      @for (item of items.value(); track item.slug){
       <tr class="border">
      <td class="border w-80  py-4 text-start px-1">{{item.name}}</td>
      <td class="border w-30 text-start px-1">{{item.sku}}</td>
      <td class="border w-30 text-start px-1">${{item.price }}</td>
      <td class="border w-10">
        <div class="flex gap-2 justify-center items-center">

          <button class="w-5 flex justify-center items-center border-box" >
            <svg
              class="flex border-box w-5"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="currentColor"
              viewBox="0 0 24 24"
            >
              <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
              <path
                d="M17 6V4c0-1.1-.9-2-2-2H9c-1.1 0-2 .9-2 2v2H2v2h2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8h2V6zM9 4h6v2H9zM6 20V8h12v12z"
              ></path>
              <path d="M9 10h2v8H9zm4 0h2v8h-2z"></path>
            </svg>
          </button>
        </div>
      </td>
      </tr>

   }
    }
    
   </tbody>
   
</table>
</div>
