<div class="w-100 gap-4  flex flex-col items-center border-box p-3">
  <img [src]="product().imageUrl" class="w-100" alt="">
  <div class=" flex flex-col gap-2">
    <p class="text-3xl font-semibold">{{ product().name }}</p>
    <p class="text-gray-400">{{ product().brand }}</p>
    <p>{{ product().description }}</p>
  </div>
  <div class="felx flex-col items-start w-full">
    <p>{{ product().price }} $</p>
    
  </div>
  <button class="bg-amber-100 p-2 w-50 border border-black rounded-2xl" >Add to cart</button>
</div>
