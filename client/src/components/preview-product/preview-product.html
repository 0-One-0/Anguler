<div class="flex flex-col max-w-fit justify-center items-center relative">
  <div class="relative flex w-fit">
    <img
      [routerLink]="'/products/' + product().slug"
      class="w-90  relative md:w-93 lg:w-100"
      [src]="product().imageUrl"
      alt=""
    />
    <svg
      xmlns="http://www.w3.org/2000/svg"
      wight="30"
      height="40"
      fill="#000000"
      viewBox="0 0 24 24"
      class="m-0 p-0 absolute bottom-4 right-4"
    >
      <path
        d="M11.29 20.66c.2.2.45.29.71.29s.51-.1.71-.29l7.5-7.5c2.35-2.35 2.35-6.05 0-8.41-2.3-2.28-5.85-2.35-8.21-.2-2.36-2.15-5.91-2.09-8.21.2-2.35 2.36-2.35 6.06 0 8.41zM5.21 6.16C6 5.38 7 4.99 8.01 4.99s2.01.39 2.79 1.17l.5.5c.39.39 1.02.39 1.41 0l.5-.5c1.56-1.56 4.02-1.56 5.59 0 1.56 1.57 1.56 4.02 0 5.58l-6.79 6.79-6.79-6.79a3.91 3.91 0 0 1 0-5.58Z"
      ></path>
    </svg>
    @if (newItem()) {
      <div class="text-white bg-black border-box py-1 px-2 rounded absolute top-5 left-4">News</div>
    } 
  </div>

  <div class="flex relative justify-start border-box min-h-25 w-full p-2">
    <div class="">
      <p class="flex box-border max-w-50">{{ product().name }}</p>
      <p>{{ product().brand }}</p>
    </div>
    <p class="absolute right-5">{{ product().price }}$</p>
  </div>
</div>
