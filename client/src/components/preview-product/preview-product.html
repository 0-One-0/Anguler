<div class="flex flex-col w-full border border-neutral-200 rounded-lg p-3 gap-3 box-border">
  <div class="relative w-full">
    @if (newItem()) {
      <div class="absolute top-2 left-2 z-10 bg-black text-white text-[10px] font-bold uppercase tracking-wide px-2 py-1 rounded">
        New
      </div>
    }
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="absolute top-2 right-2 z-10 w-5 h-5"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.099 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"
      />
    </svg>
    <img
      [routerLink]="'/products/' + product().slug"
      class="w-full aspect-3/4 object-cover rounded box-border cursor-pointer"
      [src]="product().imageUrl"
      alt=""
    />
  </div>

  <div class="font-body flex items-start justify-between gap-2 box-border">
    <div class="min-w-0">
      <p class="font-semibold truncate">{{ product().name }}</p>
      <p class="text-sm text-neutral-500">{{ product().brand }}</p>
    </div>
    <p class="font-semibold shrink-0">${{ product().price }}</p>
  </div>
</div>
