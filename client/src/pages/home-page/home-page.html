<div class="flex flex-col">

  <img class=" " [src]="hero.imageUrl" alt="">

</div>


<div class="flex flex-col max-w-full border-box w-full  items-center gap-4 p-4">
  @for (product of Products(); track product.slug) {
    <app-preview-product
      [News]="product.news"
      [name]="product.name"
      [brand]="product.brand"
      [price]="product.price"
      [imageUrl]="product.imageUrl"
      [slug]="product.slug"
    />
  }
</div>
