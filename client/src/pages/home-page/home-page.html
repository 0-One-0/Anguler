<div class="flex flex-col items-center max-w-screen border-box w-full px-5 gap-10">
  <div
    class="flex flex-col-reverse items-center gap-5 w-full max-w-180 md:gap-6 lg:flex-row lg:items-center lg:max-w-265 lg:gap-15"
  >
    <div class="flex flex-col items-center text-center gap-3 px-4 md:gap-4 lg:items-start lg:text-left lg:max-w-100 lg:px-0 lg:shrink-0">
      <h2 class="font-logo uppercase tracking-tight text-2xl md:text-3xl">{{ hero.title }}</h2>
      <p class="text-sm text-neutral-600 md:text-base">{{ hero.description }}</p>
      <span class="text-xs font-bold uppercase tracking-wide border-b border-black pb-0.5">Our Story</span>
    </div>

    <img
      class="w-full aspect-video object-cover rounded box-border lg:flex-1 lg:w-auto lg:h-100 lg:aspect-auto"
      [src]="hero.imageUrl"
      alt=""
    />
  </div>

  <div
    class="flex flex-col max-w-screen border-box w-full items-center gap-4 p-4 md:grid grid-cols-2 md:max-w-200 md:px-0 lg:grid-cols-4 lg:max-w-265"
  >
    @if (Products.isLoading()) {
      <p>Loading...</p>
    } @else {
      @for (product of Products.value(); track product.slug) {
        <app-preview-product [product]="product" />
      }
    }
  </div>
</div>
