<div
  class="flex flex-col w-full max-w-140 mx-auto gap-8 px-4 box-border md:max-w-200 lg:max-w-265"
>
  <h1 class="font-logo uppercase tracking-tight text-xl md:text-2xl">Checkout</h1>

  <div class="flex flex-col gap-8 md:flex-row md:items-start md:gap-6 lg:gap-10">
    <div class="flex flex-col w-full md:flex-1 md:min-w-0">
      <app-basket />
    </div>

    <div
      class="font-body flex flex-col gap-4 w-full border border-neutral-200 rounded-lg p-5 box-border md:w-64 md:shrink-0 lg:w-80"
    >
      <h2 class="text-xs font-bold uppercase tracking-wide text-neutral-500">Order Summary</h2>

      <div class="flex justify-between text-sm">
        <span>Subtotal</span>
        <span>${{ subtotal() }}</span>
      </div>

      <div class="flex justify-between text-base font-bold border-t border-neutral-200 pt-3">
        <span>Total</span>
        <span>${{ subtotal() }}</span>
      </div>
    </div>
  </div>

  <app-purchase-form />

  <button class="bg-black text-white font-bold uppercase tracking-wide py-3 rounded-full w-full md:w-auto md:px-16 md:self-start">
    Place Order
  </button>
</div>
